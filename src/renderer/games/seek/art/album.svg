	</g>
	<circle cx="90" cy="26" r="20" fill="#17171c"/>
	<circle cx="90" cy="26" r="14" fill="none" stroke="#3a3a46" stroke-width="1"/>
	<circle cx="90" cy="26" r="9" fill="none" stroke="#3a3a46" stroke-width="1"/>
	<circle cx="90" cy="26" r="6" fill="#30a46c"/>
	<circle cx="90" cy="26" r="1.5" fill="#17171c"/>
	<g fill="#ffffff">
