<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
	<title>Album cover with a vinyl record and a sunset</title>
	<defs>
		<linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a1458"/>
			<stop offset="0.6" stop-color="#e5487d"/>
			<stop offset="1" stop-color="#ffb224"/>
		</linearGradient>
	</defs>
	<rect width="120" height="120" fill="url(#sunset)"/>
	<circle cx="60" cy="70" r="26" fill="#ffd23f"/>
	<g fill="#2a1458">
		<rect y="70" width="120" height="4"/>
		<rect y="80" width="120" height="5"/>
		<rect y="91" width="120" height="7"/>
		<rect y="104" width="120" height="16"/>
	</g>
	<g stroke="#ff7ab8" stroke-width="1.5" opacity="0.8">
		<line x1="0" y1="110" x2="120" y2="110"/>
