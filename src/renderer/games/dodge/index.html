<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Dodge!</title>
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="../../common/clippy.css">
  <link rel="stylesheet" href="../../common/window.css">
  <link rel="stylesheet" href="../overlay.css">
  <link rel="stylesheet" href="dodge.css">
</head>
<body>
  <div id="dim"></div>
  <div id="world">
    <canvas id="back"></canvas>
    <div id="clippy"><div class="bob"></div></div>
    <div id="wins"></div>
    <canvas id="front"></canvas>
    <div id="bubble" class="px" role="status" aria-live="polite"></div>
  </div>
  <div id="hud" hidden>
    <div class="hud-cell"><span class="hud-label">SCORE</span><b id="score" class="px">000000</b></div>
    <div class="hud-cell"><span class="hud-label">BEST</span><b id="best" class="px">000000</b></div>
    <span class="hud-hint px">Esc to pause</span>
  </div>
  <div id="count" class="px" aria-live="assertive"></div>
  <div id="dialog" class="frame-window" role="dialog" aria-modal="true" hidden></div>
  <script type="module" src="/renderer.js"></script>
</body>
</html>
